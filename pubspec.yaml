name: hotspotlink
description: WhatsApp-like chat, groups, calls and file sharing over hotspot
publish_to: none
version: 2.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.12.0
  file_picker: ^8.1.0
  image_picker: ^1.1.0
  record: ^5.1.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0
  network_info_plus: ^6.0.0
flutter:
  uses-material-design: true
