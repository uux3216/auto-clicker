name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name hex_editor .
      - run: flutter pub get
      - name: Patch plugin compileSdk to 36
        run: |
          for f in $HOME/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle; do
            sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdk 36/' "$f"
            grep -n compileSdk "$f"
          done
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hex-editor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
