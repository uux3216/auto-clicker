name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android --project-name hotspotlink --org com.example.hotspotlink .
      - name: Patch manifest
        run: python3 tools/patch_manifest.py
      - name: Install native audio module
        run: python3 tools/install_native.py
      - name: Gradle compileSdk override
        run: |
          mkdir -p ~/.gradle/init.d
          cp tools/compilesdk.gradle ~/.gradle/init.d/compilesdk.gradle
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: hotspotlink-apk
          path: build/app/outputs/flutter-apk/app-release.apk
